<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grounded-rag</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #2563eb; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; opacity: .7; }
  form { display: grid; gap: 10px; }
  textarea, input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row label { display: flex; gap: 6px; align-items: center; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { min-height: 1.5em; margin: 14px 0 0; opacity: .7; }
  #answer { white-space: pre-wrap; margin: 8px 0 20px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; }
  #answer:empty { display: none; }
  .source { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
  .source.cited { border-color: var(--accent); }
  .source header { display: flex; gap: 8px; justify-content: space-between; font-size: .85rem; opacity: .8; }
  .source p { margin: 6px 0 0; white-space: pre-wrap; font-size: .92rem; }
</style>
</head>
<body>
<h1>grounded-rag</h1>
<p class="lead">Ask a question about the indexed documents. Answers cite the passages they rely on.</p>

<form id="form">
  <textarea id="question" placeholder="Your question" required></textarea>
  <div class="row">
    <label>Mode
      <select id="mode">
        <option value="hybrid">hybrid</option>
        <option value="dense">dense</option>
        <option value="sparse">sparse (BM25)</option>
      </select>
    </label>
    <label><input type="checkbox" id="rerank"> Rerank (slower)</label>
    <input id="apikey" type="password" placeholder="API key (if required)" autocomplete="off">
  </div>
  <div class="row">
    <button class="primary" type="submit" data-action="ask">Ask</button>
    <button type="submit" data-action="search">Search only</button>
  </div>
</form>

<p id="status" role="status"></p>
<div id="answer"></div>
<div id="sources"></div>

<script>
const $ = (id) => document.getElementById(id);

function renderSources(hits) {
  const container = $("sources");
  container.replaceChildren();
  for (const hit of hits) {
    const card = document.createElement("article");
    card.className = "source" + (hit.cited ? " cited" : "");
    const header = document.createElement("header");
    const label = document.createElement("strong");
    label.textContent = `[${hit.number}] ${hit.title || hit.source || hit.doc_id}`;
    const meta = document.createElement("span");
    meta.textContent = `${hit.source || hit.doc_id} · chunk ${hit.chunk_index} · score ${hit.score.toFixed(3)}`;
    header.append(label, meta);
    const text = document.createElement("p");
    text.textContent = hit.text;
    card.append(header, text);
    container.append(card);
  }
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const action = event.submitter?.dataset.action || "ask";
  const text = $("question").value.trim();
  if (!text) return;

  const buttons = document.querySelectorAll("button");
  buttons.forEach((button) => (button.disabled = true));
  $("status").textContent = action === "ask" ? "Retrieving and answering…" : "Searching…";
  $("answer").textContent = "";
  $("sources").replaceChildren();

  const body = { mode: $("mode").value, rerank: $("rerank").checked };
  body[action === "ask" ? "question" : "query"] = text;
  const headers = { "Content-Type": "application/json" };
  if ($("apikey").value) headers["X-API-Key"] = $("apikey").value;

  try {
    const response = await fetch(`/${action}`, { method: "POST", headers, body: JSON.stringify(body) });
    const data = await response.json();
    if (!response.ok) {
      const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
      throw new Error(`${response.status}: ${detail}`);
    }
    if (action === "ask") {
      $("answer").textContent = data.answer;
      renderSources(data.sources);
      $("status").textContent = data.model ? `Answered by ${data.model}.` : "";
    } else {
      renderSources(data.hits);
      $("status").textContent = `${data.hits.length} passages (${data.mode}${data.reranked ? ", reranked" : ""}).`;
    }
  } catch (error) {
    $("status").textContent = `Request failed. ${error.message}`;
  } finally {
    buttons.forEach((button) => (button.disabled = false));
  }
});
</script>
</body>
</html>
