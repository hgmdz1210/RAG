[project]
name = "rag"
version = "0.1.0"
description = "Hybrid-search RAG service with cited answers and a reproducible retrieval benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.7",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "qdrant-client>=1.13",
    "uvicorn>=0.30",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
