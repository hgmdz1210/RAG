services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      # Published on localhost only: Qdrant has no authentication by default.
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
    env_file:
      - path: .env
        required: false
    volumes:
      # Model weights, downloaded datasets and the documents you want to index.
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy

  ui:
    build:
      context: .
      target: ui
    environment:
      RAG_API_URL: http://api:8000
      # Only the public values are passed on; the service key stays with the api.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_data:
